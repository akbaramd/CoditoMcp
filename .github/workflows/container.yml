name: Container

on:
  pull_request:
    paths:
      - deploy/**
      - relay/**
      - packages/protocol/**
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-scan-sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: codito-relay:ci-${{ github.sha }}
          build-args: |
            VERSION=0.0.0-ci
            VCS_REF=${{ github.sha }}
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: codito-relay:ci-${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: anchore/sbom-action@v0.20.6
        with:
          image: codito-relay:ci-${{ github.sha }}
          format: spdx-json
          output-file: sbom-relay.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: relay-sbom
          path: sbom-relay.spdx.json
