name: Container

on:
  pull_request:
    paths:
      - deploy/**
      - relay/**
      - packages/protocol/**
      - pyproject.toml
      - uv.lock
  push:
    branches: [main]
    paths:
      - deploy/**
      - relay/**
      - packages/protocol/**
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-scan-sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: codito-relay:ci-${{ github.sha }}
          build-args: |
            VERSION=0.0.0-ci
            VCS_REF=${{ github.sha }}
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          # GCR is blocked in some release regions; ECR is an official Trivy DB mirror.
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
        with:
          image-ref: codito-relay:ci-${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: codito-relay:ci-${{ github.sha }}
          format: spdx-json
          output-file: sbom-relay.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relay-sbom
          path: sbom-relay.spdx.json
