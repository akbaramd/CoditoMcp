name: Release Windows agent

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codito-release-main
  cancel-in-progress: false

jobs:
  build-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      resume_commit: ${{ steps.version.outputs.resume_commit }}
      release_tree: ${{ steps.sync.outputs.release_tree }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.5"
          enable-cache: true
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/vite-plugin-inspector/pnpm-lock.yaml
      - run: uv python install 3.12
      - name: Select the release version
        id: version
        shell: pwsh
        env:
          CODITO_BASE_SHA: ${{ github.sha }}
        run: |
          git fetch --force --tags origin
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to fetch release tags.'
          }

          $stablePattern = '\Av(?<version>(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))\z'
          $rawTags = @(git tag --list 'v*')
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to list release tags.'
          }
          $stableTags = @($rawTags | Where-Object { $_ -match $stablePattern })
          $resumeCandidates = @()
          foreach ($candidateTag in $stableTags) {
            if ($candidateTag -notmatch $stablePattern) {
              continue
            }
            $candidateVersion = $Matches['version']
            $candidateCommit = (git rev-parse "$candidateTag^{commit}").Trim()
            if ($LASTEXITCODE -ne 0 -or $candidateCommit -notmatch '^[0-9a-f]{40}$') {
              throw "Unable to resolve stable release tag: $candidateTag"
            }
            $parentFields = @((git rev-list --parents -n 1 $candidateCommit).Trim() -split '\s+')
            if ($LASTEXITCODE -ne 0 -or $parentFields.Count -lt 1) {
              throw "Unable to inspect stable release commit: $candidateCommit"
            }
            $isBase = $candidateCommit -eq $env:CODITO_BASE_SHA
            $isDirectChild = $parentFields.Count -eq 2 -and $parentFields[1] -eq $env:CODITO_BASE_SHA
            if ($isBase -or $isDirectChild) {
              $resumeCandidates += [pscustomobject]@{
                Tag = $candidateTag
                Version = $candidateVersion
                Commit = $candidateCommit
              }
            }
          }
          if ($resumeCandidates.Count -gt 1) {
            throw 'More than one stable tag is bound to this release input.'
          }

          if ($resumeCandidates.Count -eq 1) {
            $version = $resumeCandidates[0].Version
            $tag = $resumeCandidates[0].Tag
            $resumeCommit = $resumeCandidates[0].Commit
          }
          else {
            $declaredMatches = @(Select-String -Path pyproject.toml `
              -Pattern '^version = "(?<version>(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))"$')
            if ($declaredMatches.Count -ne 1) {
              throw 'Repository version is not one unambiguous canonical X.Y.Z SemVer.'
            }
            $declaredText = $declaredMatches[0].Matches[0].Groups['version'].Value
            $declaredVersion = [version]$declaredText
            $stableVersions = @(
              $stableTags | ForEach-Object {
                if ($_ -match $stablePattern) {
                  [pscustomobject]@{ Tag = $_; Parsed = [version]$Matches['version'] }
                }
              } | Sort-Object Parsed -Descending
            )
            if ($stableVersions.Count -eq 0 -or $declaredVersion -gt $stableVersions[0].Parsed) {
              $version = $declaredText
            }
            else {
              $latest = $stableVersions[0].Parsed
              if ($latest.Build -eq [int]::MaxValue) {
                throw 'The latest stable release patch component cannot be incremented.'
              }
              $version = '{0}.{1}.{2}' -f $latest.Major, $latest.Minor, ($latest.Build + 1)
            }
            $tag = "v$version"
            $resumeCommit = ''
            if ($tag -in $rawTags) {
              throw "Selected release tag already exists but is not a valid resume candidate: $tag"
            }
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "resume_commit=$resumeCommit" >> $env:GITHUB_OUTPUT
      - name: Synchronize and bind the release tree
        id: sync
        shell: pwsh
        env:
          CODITO_RELEASE_VERSION: ${{ steps.version.outputs.version }}
          CODITO_RESUME_COMMIT: ${{ steps.version.outputs.resume_commit }}
        run: |
          uv run --no-project python scripts/set_version.py $env:CODITO_RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) {
            throw 'Synchronizing repository versions failed.'
          }
          uv lock
          if ($LASTEXITCODE -ne 0) {
            throw 'Refreshing the lock file failed.'
          }

          $versionFiles = @(
            'pyproject.toml',
            'agent/pyproject.toml',
            'relay/pyproject.toml',
            'packages/protocol/pyproject.toml',
            'packages/vite-plugin-inspector/package.json',
            'agent/src/codito_agent/__init__.py',
            'relay/codito_relay/__init__.py',
            'agent/packaging/scripts/Build-WindowsDevPackage.ps1',
            'agent/packaging/scripts/Build-WindowsInstaller.ps1',
            'agent/packaging/wix/Codito.Agent.wixproj',
            'uv.lock'
          )
          $changedTracked = @(git diff --name-only --)
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to inspect synchronized tracked files.'
          }
          $untracked = @(git ls-files --others --exclude-standard)
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to inspect synchronized untracked files.'
          }
          $unexpected = @($changedTracked + $untracked | Where-Object { $_ -notin $versionFiles })
          if ($unexpected.Count -gt 0) {
            throw "Version synchronization changed files outside the release contract: $($unexpected -join ', ')"
          }

          git add -- $versionFiles
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to stage synchronized version files.'
          }
          $candidateTree = (git write-tree).Trim()
          if ($LASTEXITCODE -ne 0 -or $candidateTree -notmatch '^[0-9a-f]{40}$') {
            throw 'Unable to resolve the synchronized release tree.'
          }
          if ($env:CODITO_RESUME_COMMIT) {
            $tagTree = (git rev-parse "$env:CODITO_RESUME_COMMIT^{tree}").Trim()
            if ($LASTEXITCODE -ne 0 -or $tagTree -ne $candidateTree) {
              throw 'The existing release tag does not match the reconstructed release tree.'
            }
          }
          "release_tree=$candidateTree" >> $env:GITHUB_OUTPUT

          uv sync --frozen --all-packages --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - name: Strict type checks
        shell: pwsh
        run: |
          $env:MYPYPATH = 'packages/protocol/src;relay;agent/src'
          uv run mypy -p codito_protocol -p codito_relay -p codito_agent
      - name: Shared security and protocol coverage
        run: >-
          uv run --package codito-protocol pytest packages/protocol/tests
          --cov=codito_protocol --cov-report=term-missing --cov-fail-under=90
      - name: Verify schema snapshots
        shell: pwsh
        run: |
          uv run --package codito-protocol python packages/protocol/scripts/export_schemas.py
          git diff --exit-code -- packages/protocol/schemas
          if ($LASTEXITCODE -ne 0) {
            throw 'Protocol schema snapshots are stale.'
          }
          $untrackedSchemas = git status --porcelain -- packages/protocol/schemas
          if ($LASTEXITCODE -ne 0 -or $untrackedSchemas) {
            throw 'Protocol schema snapshots contain uncommitted files.'
          }
      - name: Verify relay migrations
        run: uv run --package codito-relay python relay/manage.py makemigrations --check --dry-run
      - name: Run relay tests
        run: uv run --package codito-relay pytest relay/tests -m "not e2e"
      - run: uv run --package codito-agent pytest agent/tests -m "not e2e"
      - name: Managed frontend browser regression
        env:
          CODITO_REAL_BROWSER_TESTS: "1"
        run: >-
          uv run --package codito-agent pytest
          agent/tests/test_frontend_playwright_real.py -q
      - name: Verify frontend source instrumentation
        working-directory: packages/vite-plugin-inspector
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high
          pnpm run typecheck
          pnpm test
          pnpm run build
      - run: dotnet test agent/broker/Codito.Broker.sln --configuration Release --maxcpucount:1
      - name: Install packaging extras
        run: uv sync --frozen --package codito-agent --extra ui --extra package
      - name: Build stable Windows package
        shell: pwsh
        env:
          CODITO_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: >-
          ./agent/packaging/scripts/Build-WindowsDevPackage.ps1
          -Version $env:CODITO_RELEASE_VERSION
          -Release
      - name: Pack frontend source instrumentation
        shell: pwsh
        env:
          CODITO_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:CODITO_RELEASE_VERSION
          $output = Join-Path $PWD 'installer-output'
          pnpm --dir packages/vite-plugin-inspector pack --pack-destination $output
          if ($LASTEXITCODE -ne 0) {
            throw 'Packing @codito/vite-plugin-inspector failed.'
          }
          $archive = Join-Path $output "codito-vite-plugin-inspector-$version.tgz"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "Expected frontend inspector package is missing: $archive"
          }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            "$archive.sha256",
            "$hash  $([System.IO.Path]::GetFileName($archive))`n",
            [System.Text.UTF8Encoding]::new($false)
          )
      - name: Write release metadata
        shell: pwsh
        env:
          CODITO_BASE_SHA: ${{ github.sha }}
          CODITO_RELEASE_VERSION: ${{ steps.version.outputs.version }}
          CODITO_RELEASE_TAG: ${{ steps.version.outputs.tag }}
          CODITO_RESUME_COMMIT: ${{ steps.version.outputs.resume_commit }}
          CODITO_RELEASE_TREE: ${{ steps.sync.outputs.release_tree }}
        run: |
          $output = Join-Path $PWD 'installer-output'
          $assetNames = @(
            "Codito-$env:CODITO_RELEASE_VERSION-win-x64.zip",
            "Codito-$env:CODITO_RELEASE_VERSION-win-x64.zip.sha256",
            "codito-vite-plugin-inspector-$env:CODITO_RELEASE_VERSION.tgz",
            "codito-vite-plugin-inspector-$env:CODITO_RELEASE_VERSION.tgz.sha256"
          )
          $assets = @()
          foreach ($assetName in $assetNames) {
            $assetPath = Join-Path $output $assetName
            if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
              throw "Release asset is missing: $assetName"
            }
            $assets += [ordered]@{
              name = $assetName
              sha256 = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          $metadata = [ordered]@{
            schema = 1
            base_sha = $env:CODITO_BASE_SHA
            version = $env:CODITO_RELEASE_VERSION
            tag = $env:CODITO_RELEASE_TAG
            resume_commit = $env:CODITO_RESUME_COMMIT
            release_tree = $env:CODITO_RELEASE_TREE
            assets = $assets
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $output 'release-metadata.json'),
            ($metadata | ConvertTo-Json -Depth 5),
            [System.Text.UTF8Encoding]::new($false)
          )
      - name: Transfer verified release inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codito-release-${{ github.run_id }}-${{ github.run_attempt }}
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          path: |
            pyproject.toml
            agent/pyproject.toml
            relay/pyproject.toml
            packages/protocol/pyproject.toml
            packages/vite-plugin-inspector/package.json
            agent/src/codito_agent/__init__.py
            relay/codito_relay/__init__.py
            agent/packaging/scripts/Build-WindowsDevPackage.ps1
            agent/packaging/scripts/Build-WindowsInstaller.ps1
            agent/packaging/wix/Codito.Agent.wixproj
            uv.lock
            installer-output/Codito-${{ steps.version.outputs.version }}-win-x64.zip
            installer-output/Codito-${{ steps.version.outputs.version }}-win-x64.zip.sha256
            installer-output/codito-vite-plugin-inspector-${{ steps.version.outputs.version }}.tgz
            installer-output/codito-vite-plugin-inspector-${{ steps.version.outputs.version }}.tgz.sha256
            installer-output/release-metadata.json

  native-publish:
    needs: build-and-verify
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Receive verified release inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codito-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codito-release-bundle
      - name: Validate release inputs and prepare refs
        id: refs
        shell: pwsh
        env:
          CODITO_BASE_SHA: ${{ github.sha }}
          CODITO_EXPECTED_VERSION: ${{ needs.build-and-verify.outputs.version }}
          CODITO_EXPECTED_TAG: ${{ needs.build-and-verify.outputs.tag }}
          CODITO_EXPECTED_RESUME_COMMIT: ${{ needs.build-and-verify.outputs.resume_commit }}
          CODITO_EXPECTED_RELEASE_TREE: ${{ needs.build-and-verify.outputs.release_tree }}
          CODITO_RELEASE_BUNDLE: ${{ runner.temp }}/codito-release-bundle
        run: |
          $metadataPath = Join-Path $env:CODITO_RELEASE_BUNDLE 'installer-output/release-metadata.json'
          if (-not (Test-Path -LiteralPath $metadataPath -PathType Leaf)) {
            throw 'Transferred release metadata is missing.'
          }
          $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
          if ($metadata.schema -ne 1 -or
              $metadata.base_sha -ne $env:CODITO_BASE_SHA -or
              $metadata.version -ne $env:CODITO_EXPECTED_VERSION -or
              $metadata.tag -ne $env:CODITO_EXPECTED_TAG -or
              [string]$metadata.resume_commit -ne $env:CODITO_EXPECTED_RESUME_COMMIT -or
              $metadata.release_tree -ne $env:CODITO_EXPECTED_RELEASE_TREE) {
            throw 'Transferred release metadata does not match the workflow outputs.'
          }

          $expectedAssetNames = @(
            "Codito-$env:CODITO_EXPECTED_VERSION-win-x64.zip",
            "Codito-$env:CODITO_EXPECTED_VERSION-win-x64.zip.sha256",
            "codito-vite-plugin-inspector-$env:CODITO_EXPECTED_VERSION.tgz",
            "codito-vite-plugin-inspector-$env:CODITO_EXPECTED_VERSION.tgz.sha256"
          )
          $metadataAssets = @($metadata.assets)
          if ($metadataAssets.Count -ne 4 -or
              (@($metadataAssets.name | Sort-Object) -join "`n") -ne
              (@($expectedAssetNames | Sort-Object) -join "`n")) {
            throw 'Transferred release metadata must describe exactly the four expected assets.'
          }
          foreach ($asset in $metadataAssets) {
            if ($asset.sha256 -notmatch '^[0-9a-f]{64}$') {
              throw "Transferred release asset has an invalid digest: $($asset.name)"
            }
            $assetPath = Join-Path (Join-Path $env:CODITO_RELEASE_BUNDLE 'installer-output') $asset.name
            if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
              throw "Transferred release asset is missing: $($asset.name)"
            }
            $actualHash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $asset.sha256) {
              throw "Transferred release asset failed SHA-256 verification: $($asset.name)"
            }
          }

          $versionFiles = @(
            'pyproject.toml',
            'agent/pyproject.toml',
            'relay/pyproject.toml',
            'packages/protocol/pyproject.toml',
            'packages/vite-plugin-inspector/package.json',
            'agent/src/codito_agent/__init__.py',
            'relay/codito_relay/__init__.py',
            'agent/packaging/scripts/Build-WindowsDevPackage.ps1',
            'agent/packaging/scripts/Build-WindowsInstaller.ps1',
            'agent/packaging/wix/Codito.Agent.wixproj',
            'uv.lock'
          )
          foreach ($relativePath in $versionFiles) {
            $sourcePath = Join-Path $env:CODITO_RELEASE_BUNDLE $relativePath
            if (-not (Test-Path -LiteralPath $sourcePath -PathType Leaf)) {
              throw "Transferred version file is missing: $relativePath"
            }
            Copy-Item -LiteralPath $sourcePath -Destination (Join-Path $PWD $relativePath) -Force
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $versionFiles
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to stage transferred version files.'
          }
          $candidateTree = (git write-tree).Trim()
          if ($LASTEXITCODE -ne 0 -or $candidateTree -notmatch '^[0-9a-f]{40}$') {
            throw 'Unable to resolve the transferred release tree.'
          }
          if ($candidateTree -ne $env:CODITO_EXPECTED_RELEASE_TREE) {
            throw 'Transferred version files do not match the verified build tree.'
          }

          $tag = $env:CODITO_EXPECTED_TAG
          git show-ref --verify --quiet "refs/tags/$tag"
          $tagStatus = $LASTEXITCODE
          if ($tagStatus -eq 0) {
            $tagCommit = (git rev-parse "$tag^{commit}").Trim()
            if ($LASTEXITCODE -ne 0 -or $tagCommit -notmatch '^[0-9a-f]{40}$') {
              throw 'Unable to resolve the existing release tag.'
            }
            if ($env:CODITO_EXPECTED_RESUME_COMMIT -and
                $tagCommit -ne $env:CODITO_EXPECTED_RESUME_COMMIT) {
              throw 'The resume tag no longer resolves to the verified release commit.'
            }
            $parentFields = @((git rev-list --parents -n 1 $tagCommit).Trim() -split '\s+')
            if ($LASTEXITCODE -ne 0 -or $parentFields.Count -lt 1) {
              throw 'Unable to inspect the resume release commit.'
            }
            $isBase = $tagCommit -eq $env:CODITO_BASE_SHA
            $isDirectChild = $parentFields.Count -eq 2 -and $parentFields[1] -eq $env:CODITO_BASE_SHA
            if (-not ($isBase -or $isDirectChild)) {
              throw 'The resume tag is not the input commit or its one-parent direct child.'
            }
            $tagTree = (git rev-parse "$tagCommit^{tree}").Trim()
            if ($LASTEXITCODE -ne 0 -or $tagTree -ne $candidateTree) {
              throw 'The resume tag tree does not match the transferred release tree.'
            }
            git merge-base --is-ancestor $tagCommit origin/main
            if ($LASTEXITCODE -ne 0) {
              throw 'The resume release commit is not present on origin/main.'
            }
            "release_commit=$tagCommit" >> $env:GITHUB_OUTPUT
            'push_refs=false' >> $env:GITHUB_OUTPUT
          }
          elseif ($tagStatus -eq 1) {
            if ($env:CODITO_EXPECTED_RESUME_COMMIT) {
              throw 'The previously verified resume tag has disappeared.'
            }
            git diff --cached --quiet
            $diffStatus = $LASTEXITCODE
            if ($diffStatus -eq 1) {
              git commit -m "chore(release): $tag [skip ci]"
              if ($LASTEXITCODE -ne 0) {
                throw 'Unable to create the synchronized release commit.'
              }
            }
            elseif ($diffStatus -ne 0) {
              throw "Unable to inspect synchronized release changes (git exit $diffStatus)."
            }
            $releaseCommit = (git rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $releaseCommit -notmatch '^[0-9a-f]{40}$') {
              throw 'Unable to resolve the release commit.'
            }
            if ($releaseCommit -ne $env:CODITO_BASE_SHA) {
              $parentFields = @((git rev-list --parents -n 1 $releaseCommit).Trim() -split '\s+')
              if ($LASTEXITCODE -ne 0 -or $parentFields.Count -ne 2 -or
                  $parentFields[1] -ne $env:CODITO_BASE_SHA) {
                throw 'The generated release commit is not a one-parent direct child of the input commit.'
              }
            }
            $releaseTree = (git rev-parse "$releaseCommit^{tree}").Trim()
            if ($LASTEXITCODE -ne 0 -or $releaseTree -ne $candidateTree) {
              throw 'The generated release commit does not preserve the verified release tree.'
            }
            git tag -a $tag -m "Codito $env:CODITO_EXPECTED_VERSION"
            if ($LASTEXITCODE -ne 0) {
              throw 'Unable to create the annotated release tag.'
            }
            "release_commit=$releaseCommit" >> $env:GITHUB_OUTPUT
            'push_refs=true' >> $env:GITHUB_OUTPUT
          }
          else {
            throw "Unable to inspect release tag (git exit $tagStatus)."
          }
      - name: Atomically publish the release refs
        if: steps.refs.outputs.push_refs == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CODITO_RELEASE_TAG: ${{ needs.build-and-verify.outputs.tag }}
        run: |
          gh auth setup-git
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to configure authenticated Git transport.'
          }
          git push --atomic origin 'HEAD:refs/heads/main' `
            "refs/tags/$env:CODITO_RELEASE_TAG:refs/tags/$env:CODITO_RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw 'Atomic release ref publication failed.'
          }
      - name: Publish or repair the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CODITO_RELEASE_VERSION: ${{ needs.build-and-verify.outputs.version }}
          CODITO_RELEASE_TAG: ${{ needs.build-and-verify.outputs.tag }}
          CODITO_RELEASE_COMMIT: ${{ steps.refs.outputs.release_commit }}
          CODITO_RELEASE_BUNDLE: ${{ runner.temp }}/codito-release-bundle
        run: |
          $assetRoot = Join-Path $env:CODITO_RELEASE_BUNDLE 'installer-output'
          $assetNames = @(
            "Codito-$env:CODITO_RELEASE_VERSION-win-x64.zip",
            "Codito-$env:CODITO_RELEASE_VERSION-win-x64.zip.sha256",
            "codito-vite-plugin-inspector-$env:CODITO_RELEASE_VERSION.tgz",
            "codito-vite-plugin-inspector-$env:CODITO_RELEASE_VERSION.tgz.sha256"
          )
          $assetPaths = @($assetNames | ForEach-Object { Join-Path $assetRoot $_ })
          $localDigests = @{}
          foreach ($assetPath in $assetPaths) {
            $localDigests[[System.IO.Path]::GetFileName($assetPath)] =
              (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          }

          $repository = $env:GITHUB_REPOSITORY
          $apiPath = "repos/$repository/releases/tags/$env:CODITO_RELEASE_TAG"
          $errorPath = Join-Path $env:RUNNER_TEMP 'codito-release-query-error.txt'
          $releaseJson = gh api $apiPath 2> $errorPath
          $queryStatus = $LASTEXITCODE
          if ($queryStatus -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            if ($release.tag_name -ne $env:CODITO_RELEASE_TAG -or $release.draft -or $release.prerelease) {
              throw 'The existing GitHub release does not match the stable release contract.'
            }
            gh release upload $env:CODITO_RELEASE_TAG @assetPaths --clobber
            if ($LASTEXITCODE -ne 0) {
              throw 'Repairing the existing GitHub release assets failed.'
            }
          }
          else {
            $queryError = if (Test-Path -LiteralPath $errorPath) {
              Get-Content -LiteralPath $errorPath -Raw
            } else { '' }
            if ($queryError -notmatch '\bHTTP 404\b') {
              throw "Unable to inspect the GitHub release: $queryError"
            }
            gh release create $env:CODITO_RELEASE_TAG @assetPaths `
              --verify-tag `
              --generate-notes `
              --title "Codito $env:CODITO_RELEASE_VERSION"
            if ($LASTEXITCODE -ne 0) {
              throw 'Creating the GitHub release failed.'
            }
          }

          $verificationErrors = @()
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            $releaseJson = gh api $apiPath
            if ($LASTEXITCODE -ne 0) {
              $verificationErrors = @('Unable to read the published GitHub release.')
            }
            else {
              $release = $releaseJson | ConvertFrom-Json
              $assets = @($release.assets)
              $verificationErrors = @()
              if ($release.tag_name -ne $env:CODITO_RELEASE_TAG -or $release.draft -or $release.prerelease) {
                $verificationErrors += 'Published release identity or stability state is incorrect.'
              }
              if ($assets.Count -ne 4) {
                $verificationErrors += "Expected exactly four release assets; found $($assets.Count)."
              }
              if ((@($assets.name | Sort-Object) -join "`n") -ne
                  (@($assetNames | Sort-Object) -join "`n")) {
                $verificationErrors += 'Published release asset names are incomplete or contain extras.'
              }
              foreach ($asset in $assets) {
                if (-not $localDigests.ContainsKey($asset.name)) {
                  continue
                }
                $expectedDigest = "sha256:$($localDigests[$asset.name])"
                if ([string]$asset.digest -ne $expectedDigest) {
                  $verificationErrors += "Published digest mismatch for $($asset.name)."
                }
              }
            }
            if ($verificationErrors.Count -eq 0) {
              break
            }
            if ($attempt -lt 5) {
              Start-Sleep -Seconds 2
            }
          }
          if ($verificationErrors.Count -gt 0) {
            throw ($verificationErrors -join ' ')
          }
