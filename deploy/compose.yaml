name: codito

x-relay-environment: &relay-environment
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
  DJANGO_DEBUG: "false"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-codito.akbaramd.ir}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://codito.akbaramd.ir}
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:?set trusted proxy source IPs}
  DATABASE_URL: ${DATABASE_URL:?set the dedicated Codito database URL}
  REDIS_URL: ${REDIS_URL:?set the authenticated dedicated Redis database URL}
  METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?set METRICS_BEARER_TOKEN}
  # Strict, single-line base64 avoids multiline/private-key parsing through Compose.
  OIDC_RSA_PRIVATE_KEY_B64: ${OIDC_RSA_PRIVATE_KEY_B64:?set OIDC_RSA_PRIVATE_KEY_B64}
  DESKTOP_OAUTH_CLIENT_ID: ${DESKTOP_OAUTH_CLIENT_ID:-codito-windows-agent}
  CHATGPT_CLIENT_METADATA_HOSTS: ${CHATGPT_CLIENT_METADATA_HOSTS:-chatgpt.com,openai.com}
  OAUTH_ACCESS_TOKEN_EXPIRE_SECONDS: ${OAUTH_ACCESS_TOKEN_EXPIRE_SECONDS:-3600}
  OAUTH_REFRESH_TOKEN_EXPIRE_SECONDS: ${OAUTH_REFRESH_TOKEN_EXPIRE_SECONDS:-7776000}
  DEVICE_OFFLINE_AFTER_SECONDS: "75"
  DEVICE_QUEUE_LIMIT: "32"

x-relay-base: &relay-base
  image: ${CODITO_RELAY_IMAGE:?set immutable CODITO_RELAY_IMAGE}
  platform: linux/amd64
  environment: *relay-environment
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 35s
  networks:
    - codito-internal
    - postgres-network
    - redis-network

services:
  relay:
    <<: *relay-base
    ports:
      - "${BIND_ADDRESS:-192.168.200.39}:8094:8094"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8094/health/live', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  migrate:
    <<: *relay-base
    profiles: ["tools"]
    restart: "no"
    command: ["python", "/app/relay/manage.py", "migrate", "--noinput"]

  cleanup:
    <<: *relay-base
    profiles: ["tools"]
    restart: "no"
    command: ["python", "/app/relay/manage.py", "cleanup_codito"]

networks:
  codito-internal:
    name: codito-internal
    driver: bridge
  postgres-network:
    external: true
    name: postgres-network
  redis-network:
    external: true
    name: redis-network
